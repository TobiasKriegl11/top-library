<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top-Library</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="book-library">
    <h1>My Book Library</h1>

    <button 
        type="button" 
        id="new-book-button" 
        class="new-book-button">
        New Book
    </button>

    <section id="library"></section>
  </main>

    <dialog id="book-dialog" closedby="any">
        <form id="book-form">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" required>

            <label for="author">Author</label>
            <input type="text" id="author" name="author" required>

            <label for="pages">Number of pages</label>
            <input type="number" id="pages" name="pages" min="1" step="1" required>

            <label for="is-read">Already read</label>
            <input type="checkbox" id="is-read" name="is-read">

            <button type="submit">Add Book</button>
        </form>
    </dialog>    

    <script src="script.js"></script>
</body>
</html>
